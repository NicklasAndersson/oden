services:
  oden:
    build: .
    image: ghcr.io/nicklasandersson/oden:latest
    ports:
      - "8080:8080"
    volumes:
      - oden-data:/data
      - ./vault:/vault
    environment:
      - ODEN_HOME=/data
      - ODEN_VAULT=/vault
      - WEB_HOST=0.0.0.0
    restart: unless-stopped

volumes:
  oden-data:
