{#- Tab: Avancerat (loggning, retention) — signal-cli och Signal-protokoll ligger i Signal-fliken -#}
<div id="tab-advanced" class="tab-content">
    <form id="config-form-advanced" class="config-form">
        <div class="config-section">
            <h3>📝 Loggning</h3>
            <div class="config-grid">
                <div class="config-field">
                    <label for="cfg-log-level">Loggnivå</label>
                    <select id="cfg-log-level" name="log_level">
                        <option value="DEBUG">DEBUG</option>
                        <option value="INFO">INFO</option>
                        <option value="WARNING">WARNING</option>
                        <option value="ERROR">ERROR</option>
                    </select>
                    <span class="help-text">Detaljnivå för loggning. DEBUG ger mest information, ERROR ger minst</span>
                </div>
                <div class="config-field">
                    <label for="cfg-raw-retention-days">Retention (dagar)</label>
                    <input type="number" id="cfg-raw-retention-days" name="raw_message_retention_days" min="1" max="3650" placeholder="30">
                    <span class="help-text">Rensa råmeddelanden och pipeline-events äldre än detta antal dagar</span>
                </div>
            </div>
        </div>

    </form>

</div>
